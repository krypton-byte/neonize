[project]
name = "neonize"
description = "Neonize is a Python library designed to streamline the automation of tasks on WhatsApp"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "httpx>=0.28.1",
    "linkpreview>=0.11.0",
    "phonenumbers>=8.13.52",
    "pillow>=11.1.0",
    "protobuf>=6.32.1",
    "python-magic>=0.4.27 ; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
    "requests>=2.32.3",
    "segno>=1.6.1",
    "tqdm>=4.67.1",
]
[project.urls]
HomePage = "https://github.com/krypton-byte/neonize"
[dependency-groups]
dev = [
    "python-semantic-release>=10.6",
    "mypy-protobuf>=3.6.0",
    "taskipy>=1.14.1",
    "types-requests>=2.32.0.20241016",
    "wheel>=0.45.1",
]
docs = [
    "zensical>=0.0.57; python_version >= '3.10'",
    "mkdocs-material>=9.6; python_version >= '3.10'",
    "mkdocstrings>=1.0.0; python_version >= '3.10'",
    "mkdocstrings-python>=1.12.0; python_version >= '3.10'",
    "mike>=2.1.0; python_version >= '3.10'",
]

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git" }

[tool.taskipy.tasks]
build = {cmd = "uv run -m tools.goneonize", help = "build goneonize"}
# Documentation tasks
docs-serve = {cmd = "uv run --no-sync zensical serve -f mkdocs.yml", help = "Start Zensical development server with live reload"}
docs-build = {cmd = "uv run --no-sync zensical build -f mkdocs.yml -s", help = "Build documentation in strict mode (CI parity)"}
version = {cmd = "uv run -m tools.version_cli", help = "set neonize & goneonize version"}
download = {cmd = "uv run -m tools.download", help="Download goneonize from github release with specific version"}
repack = {cmd = "uv run -m tools.repack", help="generate wheel with spesific os & arch"}
proto = {cmd = "uv run -m tools.update_proto", help="update whatsapp proto files"}
goneonize_changed = {cmd = "uv run -m tools.build_goneonize_decision", help = "This command to compares the latest release of goneonize"}
docs-clean = {cmd = "rm -rf site/", help = "Clean built documentation"}
docs-validate = {cmd = "uv run --no-sync zensical build -f mkdocs.yml -s", help = "Build docs in strict mode (same as CI)"}

[tool.semantic_release]
version_variables = [
    "neonize/__init__.py:__version__",
    "neonize/download.py:__GONEONIZE_VERSION__",
    "goneonize/version.go:version",
]
tag_format = "{version}"
allow_zero_version = true
major_on_zero = false
commit_parser = "conventional"

[tool.semantic_release.branches.master]
match = "(master)"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.uv.workspace]
exclude = ["docs/","goneonize/"]
members = ["neonize/neonize-*"]
[tool.pdm.version]
source = "file"
path = "neonize/__init__.py"
[tool.pdm.build]
includes = ["neonize/", "neonize/neonize-*"]
excludes = ["goneonize"]
# run-setuptools = true
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
[tool.ruff]
exclude = [
    "proto","*.pyi", "docs"
]
line-length = 100

[tool.ruff.lint]
# Explicit, deterministic rule set: real errors (E4/E7/E9), pyflakes (F) and
# import sorting (I). Broader opinionated suites (UP/B/SIM/TRY/...) can be
# enabled incrementally once the existing findings are addressed.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
exclude = ["docs"]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
