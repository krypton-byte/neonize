site_name: Neonize
site_description: Python WhatsApp automation library powered by a native Go core (whatsmeow) through zero-copy FFI
site_author: krypton-byte
site_url: https://krypton-byte.github.io/neonize/
repo_name: krypton-byte/neonize
repo_url: https://github.com/krypton-byte/neonize
edit_uri: edit/master/docs/

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Authentication: getting-started/authentication.md
      - Contributing: development/contributing.md
  - Core Concepts:
      - Architecture: core-concepts/architecture.md
      - Event Model: core-concepts/event-model.md
      - JID and Addressing: core-concepts/jid-and-addressing.md
      - Sessions and Storage: core-concepts/sessions-and-storage.md
  - Guides:
      - Sending Messages: guides/sending-messages.md
      - Receiving Messages: guides/receiving-messages.md
      - Media Handling: guides/media-handling.md
      - Group Management: guides/group-management.md
      - Contacts and Presence: guides/contacts-and-presence.md
      - Newsletters and Channels: guides/newsletters-and-channels.md
      - Interactive Messages and Polls: guides/interactive-messages-and-polls.md
      - Client Configuration: guides/client-configuration.md
  - Async Client:
      - Overview: async/index.md
      - Quick Start: async/quickstart.md
      - Event Handling: async/event-handling.md
      - Best Practices: async/best-practices.md
  - API Reference:
      - Overview: api-reference/index.md
      - Sync Client: api-reference/client.md
      - Async Client: api-reference/async-client.md
      - Events: api-reference/events.md
      - Types: api-reference/types.md
      - Exceptions: api-reference/exceptions.md
      - Utilities: api-reference/utils.md
  - Examples:
      - Basic Bot: examples/basic-bot.md
      - Async Bot: examples/async-bot.md
      - Pairing by Phone Number: examples/paircode.md
      - Multi-Session: examples/multi-session.md
      - Interactive Messages: examples/interactive-async.md
  - Development:
      - Building from Source: development/building.md
      - Testing: development/testing.md
      - Release Process: development/release-process.md
  - FAQ: faq.md
  - Changelog: changelog.md

theme:
  name: material
  variant: modern
  language: en
  logo: assets/mascot.png
  favicon: assets/mascot.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.code.line_highlight
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mike:
      alias_type: symlink
      deploy_prefix: ""
      canonical_version: null
      version_selector: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            allow_inspection: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 3
            members_order: source
            docstring_style: sphinx
            docstring_section_style: spacy
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 80
            filters:
              - "!^_"
      enable_inventory: true
  - autorefs

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets:
      base_path:
        - docs
        - .
        - docs/snippets
  - toc:
      permalink: true
      toc_depth: 2-4

extra_css:
  - assets/stylesheets/extra.css

extra:
  version:
    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/krypton-byte/neonize
      name: GitHub Repository
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/neonize/
      name: PyPI Package
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/krypton-byte
      name: Sponsor this project
  generator: false
